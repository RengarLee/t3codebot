name: Bot Release

on:
  push:
    tags:
      - "v*-nightly.*"
      - "v*.*.*"
      - "!v*-preview.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: "Explicit release version override (e.g. 0.1.12-nightly.20261124.1 or 0.1.1200)"
        required: false
        default: ""
        type: string
      skip_verify:
        description: "Skip bot-verify gate (only use if commit was already verified)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Verified commit SHA to build and release"
        required: true
        type: string
      channel:
        description: "Release channel (nightly or stable)"
        required: false
        default: nightly
        type: string
      source:
        description: "Release trigger source (upstream-sync or bot)"
        required: false
        default: bot
        type: string
      upstream_tag:
        description: "Optional upstream tag label for release title"
        required: false
        default: ""
        type: string
      version:
        description: "Resolved release version without leading v"
        required: false
        default: ""
        type: string
      skip_verify:
        description: "Set true when caller already ran bot-verify.yml on this exact ref"
        required: false
        default: false
        type: boolean
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false

concurrency:
  group: bot-release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - id: meta
        name: Resolve version, channel, and tag
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_DATE: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          git fetch --tags origin || true
          target_ref="${INPUT_REF:-$GITHUB_SHA}"
          resolved_sha="$(git rev-parse "$target_ref")"
          echo "ref=$resolved_sha" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME#v}"
            if [[ "$raw_version" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
              channel="nightly"
            else
              channel="stable"
            fi
          else
            channel="${INPUT_CHANNEL:-nightly}"
            raw_version="${INPUT_VERSION#v}"
          fi

          source="${INPUT_SOURCE:-bot}"
          nightly_date="$(date -u -d "$RUN_DATE" +%Y%m%d)"
          args=(
            --channel "$channel"
            --source "$source"
            --date "$nightly_date"
            --sha "$resolved_sha"
            --github-output
          )
          if [[ -n "$raw_version" ]]; then
            args+=(--version "$raw_version")
          fi
          if [[ -n "$INPUT_UPSTREAM_TAG" ]]; then
            args+=(--upstream-tag "$INPUT_UPSTREAM_TAG")
          fi

          echo "release_channel=$channel" >> "$GITHUB_OUTPUT"
          node scripts/bot-release-version.ts "${args[@]}"

      - id: public_config
        name: Resolve Clerk & Relay public config (repo vars or .env.example fallback)
        shell: bash
        env:
          VAR_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          VAR_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
          VAR_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
          VAR_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          clerk_publishable_key="${VAR_CLERK_PUBLISHABLE_KEY:-$(env_example CLERK_PUBLISHABLE_KEY)}"
          clerk_jwt_template="${VAR_CLERK_JWT_TEMPLATE:-$(env_example CLERK_JWT_TEMPLATE)}"
          clerk_cli_oauth_client_id="${VAR_CLERK_CLI_OAUTH_CLIENT_ID:-$(env_example CLERK_CLI_OAUTH_CLIENT_ID)}"
          relay_url="${VAR_RELAY_URL:-$(env_example RELAY_URL)}"

          echo "clerk_publishable_key=$clerk_publishable_key" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=$clerk_jwt_template" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=$clerk_cli_oauth_client_id" >> "$GITHUB_OUTPUT"
          echo "relay_url=$relay_url" >> "$GITHUB_OUTPUT"

  verify:
    name: Strict Verification Gate (including E2E)
    needs: [preflight]
    if: ${{ inputs.skip_verify != true }}
    uses: ./.github/workflows/bot-verify.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      run_full_upstream_tests: true

  build_bundle:
    name: Build JS Bundle
    needs: [preflight, verify]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Windows x64 desktop + CLI build & verification (artifacts downloadable from the workflow run).
  # Explicit `if` is required so `skip_verify: true` does not transitively skip this job via `verify`.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/bot-release-win.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows x64
      verify_runner: windows-2025
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
